[project]
name = "disguisebrowser"
version = "0.1.0"
description = "Live, stealth browser automation on top of the real system Chrome: quiet CDP, below-JS identity, humanized input."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "DisguiseBrowser contributors" }]
keywords = ["browser", "automation", "scraping", "stealth", "anti-detect", "cdp", "chrome"]
dependencies = [
    "python-xlib>=0.33",
    "websockets>=17.0",
]

[project.scripts]
disguise = "disguisebrowser.cli:main"

[project.optional-dependencies]
mcp = [
    "mcp>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "ruff>=0.16",
    "mypy>=2.0",
    "types-python-xlib>=0.33.0.20261006",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/disguisebrowser"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "RUF", "SIM", "PL", "N", "ANN"]
ignore = [
    "PLR0913", # many keyword arguments are fine for launch()/Persona
    "PLR2004", # magic numbers in timing/geometry code are documented inline
    "ANN401",  # Any is legitimate for raw CDP payloads
    "ASYNC109", # explicit `timeout` parameters are part of the public API (Playwright-style)
    "RUF001", "RUF002", "RUF003", # typographic characters (→ — …) in messages and comments
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PLR", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
packages = ["disguisebrowser"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: requires Google Chrome (and Xvfb for the virtual display); skipped if unavailable",
    "live: hits public detection sites over the network; run manually",
]
addopts = "-m 'not live'"
